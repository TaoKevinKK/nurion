[project]
name = "nurion-control"
version = "0.2.2"
description = "Nurion control plane service (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "pylance>=4.0.0",
    "lance-namespace>=0.6.0",
    "fastapi>=0.135.0",
    "pydantic-settings>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "uvicorn[standard]>=0.42.0",
    "pyiceberg[sql-postgres]>=0.11.1",
    "boto3>=1.42.0",
    "fsspec>=2026.3.0",
    "s3fs>=2026.3.0",
    "kubernetes>=35.0.0",
    "pyyaml>=6.0.0",
    "psycopg[binary]>=3.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.0",
    "pyiceberg>=0.11.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
    "testcontainers[k3s,minio,postgres]>=4.14.0",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["control", "control.*"]
exclude = ["alembic", "alembic.*"]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable
check_untyped_defs = false     # Gradually enable
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = [
    "^tests/",
    "^alembic/",
]

[[tool.mypy.overrides]]
module = [
    "pyiceberg.*",
    "lance.*",
    "pylance.*",
    "lance_namespace.*",
    "kubernetes.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "fsspec.*",
    "s3fs.*",
    "asyncpg.*",
    "uvicorn.*",
    "testcontainers.*",
    "psycopg.*",
    "yaml",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # Ignore function calls in default arguments (FastAPI pattern)
    "SIM105",  # Allow try-except-pass pattern
]

[tool.ruff.lint.isort]
known-first-party = ["control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
