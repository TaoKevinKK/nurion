syntax = "proto3";

package workqueue;

// ============================================================================
// WorkQueue Service Definition
// ============================================================================

service WorkQueue {
  // === Consumer API ===

  // Claim messages from a queue
  rpc Claim(ClaimRequest) returns (ClaimResponse);

  // Acknowledge messages as processed (delete them)
  rpc Ack(AckRequest) returns (AckResponse);

  // Negative acknowledge - return messages to queue for retry
  rpc Nack(NackRequest) returns (NackResponse);

  // Atomic operation: Ack upstream + Push downstream
  rpc AckAndForward(AckAndForwardRequest) returns (AckAndForwardResponse);

  // === Producer API ===

  // Push a single message to queue
  rpc Push(PushRequest) returns (PushResponse);

  // Push multiple messages to queue
  rpc PushBatch(PushBatchRequest) returns (PushBatchResponse);

  // === State API (integrated operator state) ===

  // Get state values by keys
  rpc StateGet(StateGetRequest) returns (StateGetResponse);

  // Put/delete state values
  rpc StatePut(StatePutRequest) returns (StatePutResponse);

  // === Heartbeat (bidirectional streaming) ===

  // Worker heartbeat to maintain lease
  rpc HeartbeatStream(stream HeartbeatPing) returns (stream HeartbeatPong);

  // === Admin API ===

  // Create a queue
  rpc CreateQueue(CreateQueueRequest) returns (CreateQueueResponse);

  // Delete a queue
  rpc DeleteQueue(DeleteQueueRequest) returns (DeleteQueueResponse);

  // Get queue statistics
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

  // === Queue Completion API ===

  // Mark a queue as finished (no more messages will be pushed)
  rpc MarkQueueFinished(MarkQueueFinishedRequest) returns (MarkQueueFinishedResponse);

  // Check if queue is finished and drained (safe to exit)
  rpc IsQueueFinished(IsQueueFinishedRequest) returns (IsQueueFinishedResponse);

  // === QueueGroup API (partitioned queues) ===

  // Create a group of partition queues atomically
  rpc CreateQueueGroup(CreateQueueGroupRequest) returns (CreateQueueGroupResponse);

  // Atomic ack upstream + push to multiple partition queues
  rpc AckAndScatter(AckAndScatterRequest) returns (AckAndScatterResponse);

  // Claim from a partition group (broker picks partition)
  rpc ClaimFromGroup(ClaimFromGroupRequest) returns (ClaimFromGroupResponse);

  // Check if all queues in a group are finished and drained
  rpc IsGroupFinished(IsGroupFinishedRequest) returns (IsGroupFinishedResponse);

  // Get stats for all partitions in a group (with skew detection)
  rpc GetGroupStats(GetGroupStatsRequest) returns (GetGroupStatsResponse);

  // Mark all queues in a group as finished
  rpc MarkGroupFinished(MarkGroupFinishedRequest) returns (MarkGroupFinishedResponse);
}

// ============================================================================
// Message Structures
// ============================================================================

message Message {
  string msg_id = 1;           // Unique message ID (UUID v7)
  string queue = 2;            // Queue name
  bytes payload = 3;           // Message payload
  double created_at = 4;       // Creation time (Unix timestamp)
  map<string, string> metadata = 5; // Optional metadata
}

// ============================================================================
// Consumer API Messages
// ============================================================================

message ClaimRequest {
  string queue = 1;            // Queue name
  string worker_id = 2;        // Worker identifier
  string lease_id = 3;         // Lease ID (from HeartbeatStream)
  int32 batch_size = 4;        // Number of messages to claim (default 1)
  int32 timeout_ms = 5;        // Wait timeout in milliseconds (0 = no wait)
}

message ClaimResponse {
  repeated Message messages = 1;    // Claimed messages
  bool has_more = 2;                // Whether queue has more messages
  repeated string claim_tokens = 3; // Claim tokens (1:1 with messages)
}

message AckRequest {
  string queue = 1;
  repeated string msg_ids = 2;      // Message IDs to acknowledge
  string worker_id = 3;
  string lease_id = 4;

  // Optional: atomic state updates with ack
  string state_namespace = 5;       // e.g., "{job_id}/{stage_id}"
  map<string, bytes> state_puts = 6;    // State keys to set
  repeated string state_deletes = 7;     // State keys to delete
  repeated string claim_tokens = 8;     // Claim tokens (1:1 with msg_ids)
}

message AckResponse {
  int32 acked_count = 1;            // Number of messages acknowledged
  repeated string failed_ids = 2;    // Message IDs that failed to ack
}

message NackRequest {
  string queue = 1;
  repeated string msg_ids = 2;
  string worker_id = 3;
  string lease_id = 4;
  NackReason reason = 5;
  int32 delay_ms = 6;               // Delay before message can be reclaimed
  repeated string claim_tokens = 7; // Claim tokens (1:1 with msg_ids)

  // Optional: atomic state updates with nack
  string state_namespace = 8;
  map<string, bytes> state_puts = 9;
  repeated string state_deletes = 10;
}

enum NackReason {
  NACK_REASON_UNSPECIFIED = 0;
  NACK_REASON_PROCESSING_FAILED = 1;  // Processing failed, needs retry
  NACK_REASON_PAYLOAD_MISSING = 2;    // Payload lost, needs rebuild (P2)
  NACK_REASON_SKIP = 3;               // Skip this message (move to DLQ)
}

message NackResponse {
  int32 nacked_count = 1;
}

message AckAndForwardRequest {
  // Upstream acknowledgment
  string upstream_queue = 1;
  repeated string upstream_msg_ids = 2;

  // Downstream push
  string downstream_queue = 3;
  repeated bytes downstream_payloads = 4;

  string worker_id = 5;
  string lease_id = 6;

  // Optional: atomic state updates with ack+forward
  string state_namespace = 7;
  map<string, bytes> state_puts = 8;
  repeated string state_deletes = 9;
  repeated string upstream_claim_tokens = 10; // Claim tokens (1:1 with upstream_msg_ids)
}

message AckAndForwardResponse {
  repeated string new_msg_ids = 1;    // Downstream message IDs
  bool success = 2;
}

// ============================================================================
// Producer API Messages
// ============================================================================

message PushRequest {
  string queue = 1;
  bytes payload = 2;
  map<string, string> metadata = 3;
}

message PushResponse {
  string msg_id = 1;
}

message PushBatchRequest {
  string queue = 1;
  repeated bytes payloads = 2;
}

message PushBatchResponse {
  repeated string msg_ids = 1;
}

// ============================================================================
// Heartbeat Messages
// ============================================================================

message HeartbeatPing {
  string worker_id = 1;
  string lease_id = 2;         // Empty on first ping, server assigns
  int64 timestamp = 3;         // Client timestamp
}

message HeartbeatPong {
  string lease_id = 1;         // Assigned or confirmed lease ID
  bool ok = 2;                 // Whether lease is valid
  int32 next_ping_ms = 3;      // Suggested next ping interval
}

// ============================================================================
// Admin API Messages
// ============================================================================

message CreateQueueRequest {
  string queue = 1;
  int32 max_depth = 2;         // Max queue depth (0 = unlimited)
  int32 message_ttl_secs = 3;  // Message TTL (0 = never expire)
}

message CreateQueueResponse {
  bool created = 1;            // true = newly created, false = already exists
}

message DeleteQueueRequest {
  string queue = 1;
  bool force = 2;              // Force delete non-empty queue
}

message DeleteQueueResponse {
  bool deleted = 1;
  int32 messages_deleted = 2;
}

message GetStatsRequest {
  string queue = 1;            // Empty = return all queues
}

message GetStatsResponse {
  map<string, QueueStats> queues = 1;
  int32 total_workers = 2;
  int64 uptime_secs = 3;
}

message QueueStats {
  string queue = 1;
  int64 pending_count = 2;     // Messages waiting to be claimed
  int64 claimed_count = 3;     // Messages currently claimed
  int64 total_pushed = 4;      // Total messages pushed
  int64 total_acked = 5;       // Total messages acknowledged
}

// ============================================================================
// State API Messages (Integrated Operator State)
// ============================================================================

message StateGetRequest {
  string namespace = 1;            // e.g., "{job_id}/{stage_id}"
  repeated string keys = 2;        // Keys to fetch
}

message StateGetResponse {
  map<string, bytes> values = 1;   // Key -> value (missing keys not included)
}

message StatePutRequest {
  string namespace = 1;
  map<string, bytes> puts = 2;     // Keys to set
  repeated string deletes = 3;     // Keys to delete
}

message StatePutResponse {
  int32 puts_count = 1;            // Number of keys set
  int32 deletes_count = 2;         // Number of keys deleted
}

// ============================================================================
// Queue Completion API Messages
// ============================================================================

message MarkQueueFinishedRequest {
  string queue = 1;                // Queue to mark as finished
}

message MarkQueueFinishedResponse {
  bool success = 1;
}

message IsQueueFinishedRequest {
  string queue = 1;                // Queue to check
}

message IsQueueFinishedResponse {
  bool finished = 1;               // True if queue marked as finished
  bool drained = 2;                // True if pending==0 && claimed==0
  bool safe_to_exit = 3;           // True if finished && drained (worker can exit)
  int64 pending_count = 4;         // Current pending count
  int64 claimed_count = 5;         // Current claimed count
}

// ============================================================================
// QueueGroup API Messages (Partitioned Queues)
// ============================================================================

message CreateQueueGroupRequest {
  string group_name = 1;           // e.g., "job123_stage2"
  int32 num_partitions = 2;        // Number of partition queues to create
}

message CreateQueueGroupResponse {
  repeated string queue_names = 1; // Created queue names
  int32 version = 2;               // Group version (0 on creation)
  bool created = 3;                // true = new, false = already existed
}

message AckAndScatterRequest {
  // Upstream ack
  string upstream_queue = 1;
  repeated string upstream_msg_ids = 2;
  repeated string upstream_claim_tokens = 3;

  // Downstream scatter to partition queues
  string group_name = 4;
  repeated PartitionPayload partitions = 5;

  // Worker identity
  string worker_id = 6;
  string lease_id = 7;

  // Atomic state updates
  string state_namespace = 8;
  map<string, bytes> state_puts = 9;
  repeated string state_deletes = 10;
}

message PartitionPayload {
  int32 partition_id = 1;          // Target partition index
  repeated bytes payloads = 2;     // Messages for this partition
}

message AckAndScatterResponse {
  bool success = 1;
  repeated string new_msg_ids = 2; // All created downstream message IDs
}

message ClaimFromGroupRequest {
  string group_name = 1;
  string worker_id = 2;
  string lease_id = 3;
  int32 batch_size = 4;            // Max messages to claim
  int32 timeout_ms = 5;
  repeated int32 assigned_partitions = 6; // Partitions this worker is assigned

  // Skew handling
  bool allow_steal = 7;            // Allow claiming from unassigned partitions
  int64 steal_pending_threshold = 8; // Only steal if pending > threshold
}

message ClaimFromGroupResponse {
  repeated Message messages = 1;
  repeated string claim_tokens = 2;
  string source_queue = 3;         // Which partition queue the messages came from
  int32 source_partition = 4;      // Partition ID
  bool has_more = 5;
}

message IsGroupFinishedRequest {
  string group_name = 1;
}

message IsGroupFinishedResponse {
  bool all_finished = 1;           // All partition queues marked finished
  bool all_drained = 2;            // All queues: pending==0 && claimed==0
  bool safe_to_exit = 3;           // all_finished && all_drained
  repeated PartitionStatus partitions = 4;
}

message PartitionStatus {
  int32 partition_id = 1;
  int64 pending_count = 2;
  int64 claimed_count = 3;
  bool finished = 4;
}

message GetGroupStatsRequest {
  string group_name = 1;
}

message GetGroupStatsResponse {
  repeated PartitionStats partitions = 1;
  int64 total_pending = 2;
  int64 total_claimed = 3;
  int64 max_partition_pending = 4;
  int64 median_partition_pending = 5;
  float skew_ratio = 6;            // max / median (0 if median==0)
  repeated int32 hot_partitions = 7; // Partitions with pending > 5x median
  int32 version = 8;               // Group version
}

message PartitionStats {
  int32 partition_id = 1;
  int64 pending_count = 2;
  int64 claimed_count = 3;
  int64 total_pushed = 4;
  int64 total_acked = 5;
}

message MarkGroupFinishedRequest {
  string group_name = 1;
}

message MarkGroupFinishedResponse {
  bool success = 1;
  int32 queues_marked = 2;        // Number of queues marked finished
}
