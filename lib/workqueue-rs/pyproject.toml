[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "workqueue-py"
version = "0.1.0"
description = "Python bindings for WorkQueue - single-queue multi-consumer work queue"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "protobuf>=5.0.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "workqueue_py.workqueue_py"
