[package]
name = "workqueue-rs"
version = "0.1.0"
edition = "2021"
description = "Single-queue multi-consumer work queue with gRPC interface"
license = "Apache-2.0"

[lib]
name = "workqueue_py"
crate-type = ["cdylib"]

[dependencies]
# PyO3 bindings
pyo3 = { version = "0.23", features = ["extension-module"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# gRPC
tonic = "0.12"
prost = "0.13"

# Storage - use latest slatedb
slatedb = "0.10"
object_store = { version = "0.11", features = ["aws"] }

# Concurrent data structures
dashmap = "6"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"

# Utilities
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
futures = "0.3"

[build-dependencies]
tonic-build = "0.12"
