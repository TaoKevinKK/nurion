# Spark 3.x / Scala 2.12 wheel.
#
# Build from this directory:
#     uv build --wheel
#
# The shared Python source lives at ../../ (lib/raydp/). package-dir below
# tells setuptools to resolve the `raydp` package against that shared tree.

[project]
name = "nurion-raydp-spark3"
version = "1.7.0"
description = "RayDP: Run Apache Spark on Ray (Nurion fork, Spark 3.x / Scala 2.12)"
authors = [
    {name = "RayDP Contributors"}
]
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "ray[default]>=2.0.0",
    "pyarrow>=8.0.0",
    "pandas>=1.0.0",
    "pyspark>=3.5,<4",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The `raydp` package lives at ../../ (lib/raydp/); subpackages under it
# (raydp.spark, raydp.jars) resolve automatically via this base mapping.
packages = ["raydp", "raydp.spark", "raydp.jars"]
package-dir = {"raydp" = "../.."}

[tool.setuptools.package-data]
raydp = ["jars/*.jar"]
