[project]
name = "raydp"
version = "1.7.0"
description = "RayDP: Run Apache Spark on Ray"
authors = [
    {name = "RayDP Contributors"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "ray[default]>=2.0.0",
    "pyarrow>=8.0.0",
    "pandas>=1.0.0",
    "pyspark>=3.4.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

# Use explicit package configuration since raydp is at the root level
[tool.setuptools]
packages = ["raydp", "raydp.spark", "raydp.jars"]
package-dir = {"raydp" = "."}

[tool.setuptools.package-data]
raydp = ["jars/*.jar"]

[tool.mypy]
python_version = "3.12"
ignore_errors = true
