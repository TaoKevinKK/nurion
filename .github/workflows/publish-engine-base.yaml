name: Publish engine base to GHCR

# Builds the standard ubuntu-based engine base image (engine/Dockerfile:
# Python 3.12, JDK 17, FFmpeg, Ray, RayDP Spark 4.1/Scala 2.13, lance-spark,
# pylance, anvil-py) and publishes it to GHCR so downstream images (e.g.
# data-api spark-query-processor) can `FROM` it without cross-account ECR.

on:
    push:
        branches: [enwei/publish-engine-ghcr]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Free disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
                  docker image prune --all --force || true
                  df -h

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push engine base
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: engine/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ghcr.io/lumalabs/nurion-engine:develop
                      ghcr.io/lumalabs/nurion-engine:${{ github.sha }}

            - name: Summary
              run: |
                  echo "### Pushed engine base" >> $GITHUB_STEP_SUMMARY
                  echo "- ghcr.io/lumalabs/nurion-engine:develop" >> $GITHUB_STEP_SUMMARY
                  echo "- ghcr.io/lumalabs/nurion-engine:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
