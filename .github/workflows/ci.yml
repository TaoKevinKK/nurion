name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check PR title format
      uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
        requireScope: false
        disallowScopes: |
          wip
          temp
        subjectPattern: ^(?![A-Z]).+$
        subjectPatternError: |
          The subject "{subject}" found in the pull request title "{title}"
          didn't match the configured pattern. Please ensure that the subject
          doesn't start with an uppercase character.
        validateSingleCommit: false

  # ============================================================================
  # Build artifacts that can be shared across jobs (with caching)
  # ============================================================================
  
  build-raydp:
    name: Build RayDP (JARs + Wheel)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache raydp wheel
      id: cache-raydp
      uses: actions/cache@v4
      with:
        path: /tmp/raydp-wheel/
        key: raydp-wheel-${{ hashFiles('lib/raydp/**') }}
    
    - name: Set up Java 11
      if: steps.cache-raydp.outputs.cache-hit != 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'maven'
        cache-dependency-path: 'lib/raydp/java/pom.xml'
    
    - name: Install uv
      if: steps.cache-raydp.outputs.cache-hit != 'true'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
    
    - name: Build raydp wheel
      if: steps.cache-raydp.outputs.cache-hit != 'true'
      run: |
        cd lib/raydp
        # Build wheel (includes JAR compilation via _build_hooks.py)
        uvx --from build pyproject-build --wheel
        echo "Built wheel:"
        ls -la dist/
        # Verify JARs are included
        unzip -l dist/*.whl | grep -E "\.jar$"
        # Copy to cache directory
        mkdir -p /tmp/raydp-wheel/
        cp dist/*.whl /tmp/raydp-wheel/
    
    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: raydp-wheel
        path: /tmp/raydp-wheel/*.whl
        retention-days: 1

  build-workqueue-rs:
    name: Build workqueue-rs Wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Cache workqueue-rs wheel
      id: cache-workqueue
      uses: actions/cache@v4
      with:
        path: /tmp/workqueue-rs-wheel/
        key: workqueue-rs-wheel-${{ hashFiles('lib/workqueue-rs/**') }}

    - name: Set up Rust
      if: steps.cache-workqueue.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Install protoc
      if: steps.cache-workqueue.outputs.cache-hit != 'true'
      uses: arduino/setup-protoc@v3
      with:
        version: "25.x"

    - name: Rust cache
      if: steps.cache-workqueue.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "lib/workqueue-rs -> target"

    - name: Install uv
      if: steps.cache-workqueue.outputs.cache-hit != 'true'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Build workqueue-rs wheel
      if: steps.cache-workqueue.outputs.cache-hit != 'true'
      run: |
        cd lib/workqueue-rs
        uvx maturin build --release
        echo "Built wheel:"
        ls -la target/wheels/
        # Generate gRPC stubs
        uv run --with grpcio-tools python -m grpc_tools.protoc -I proto --python_out=python/workqueue_py --grpc_python_out=python/workqueue_py proto/workqueue.proto
        # Copy to cache directory
        mkdir -p /tmp/workqueue-rs-wheel/
        cp target/wheels/*.whl /tmp/workqueue-rs-wheel/

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: workqueue-rs-wheel
        path: /tmp/workqueue-rs-wheel/*.whl
        retention-days: 1

  # ============================================================================
  # Test workqueue-rs (Rust unit tests)
  # ============================================================================

  test-workqueue-rs:
    name: Workqueue-rs Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          lib/workqueue-rs/**

    - name: Skip if no workqueue-rs changes
      if: steps.changed-files.outputs.any_changed == 'false' && github.event_name == 'pull_request'
      run: echo "No workqueue-rs files changed, skipping..."

    - name: Set up Rust
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: dtolnay/rust-toolchain@stable

    - name: Install protoc
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: arduino/setup-protoc@v3
      with:
        version: "25.x"

    - name: Rust cache
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "lib/workqueue-rs -> target"

    - name: Run Rust tests
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd lib/workqueue-rs
        cargo test --release

  # ============================================================================
  # Lint and code quality checks
  # ============================================================================

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: [build-raydp, build-workqueue-rs]
    if: always() && !cancelled()
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          control/**
          engine/**
          lib/**
          scripts/**
          pyproject.toml
          uv.lock
    
    - name: Skip if no relevant changes
      if: steps.changed-files.outputs.any_changed == 'false' && github.event_name == 'pull_request'
      run: echo "No relevant files changed, skipping..."
    
    - name: Download pre-built wheels
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: actions/download-artifact@v4
      with:
        pattern: '*-wheel'
        path: /tmp/wheels/
        merge-multiple: true
      continue-on-error: true
    
    - name: Install uv
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python 3.12
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: uv python install 3.12
    
    - name: Check license headers
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        python3 scripts/check_license_headers.py
    
    - name: Check control
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd control
        uv sync --dev --python 3.12
        uv run --no-sync ruff check .
        uv run --no-sync ruff format --check .

    - name: Check engine
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        # CI mode: use pre-built wheels via --find-links, skip editable sources
        uv sync --dev --python 3.12 --no-sources --find-links /tmp/wheels/
        uv run --no-sync ruff check _internal/
        uv run --no-sync ruff format --check _internal/
    
  # ============================================================================
  # Engine type checks
  # ============================================================================

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    needs: [build-raydp, build-workqueue-rs]
    if: always() && !cancelled()
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          control/**
          engine/**
          lib/**
          uv.lock

    - name: Skip if no relevant changes
      if: steps.changed-files.outputs.any_changed == 'false' && github.event_name == 'pull_request'
      run: echo "No control/engine/lib files changed, skipping..."

    - name: Download pre-built wheels
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: actions/download-artifact@v4
      with:
        pattern: '*-wheel'
        path: /tmp/wheels/
        merge-multiple: true
      continue-on-error: true
    
    - name: Install uv
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python 3.12
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: uv python install 3.12
    
    - name: Check control
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd control
        uv sync --dev --python 3.12
        uv run --no-sync mypy control/

    - name: Check engine
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        # CI mode: use pre-built wheels via --find-links, skip editable sources
        uv sync --dev --python 3.12 --no-sources --find-links /tmp/wheels/
        uv run --no-sync mypy _internal/ nurion/

  # ============================================================================
  # Aether tests (Python 3.12, no Rust/Java dependencies)
  # ============================================================================

  test-control:
    name: Control Plane Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          control/**
          scripts/**
          pyproject.toml
          uv.lock
    
    - name: Skip if no relevant changes
      if: steps.changed-files.outputs.any_changed == 'false' && github.event_name == 'pull_request'
      run: echo "No relevant files changed, skipping..."
    
    - name: Install uv
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python 3.12
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: uv python install 3.12
    
    - name: Install dependencies
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd control
        uv sync --dev
    
    - name: Run tests
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd control
        uv run --no-sync pytest tests/ -v
    
    - name: Upload coverage to Codecov
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: codecov/codecov-action@v4
      with:
        file: ./control/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # ============================================================================
  # Engine unit tests (no external services, fast)
  # ============================================================================

  test-engine-unit:
    name: Engine Unit Tests
    runs-on: ubuntu-latest
    needs: [build-raydp, build-workqueue-rs]
    if: always() && !cancelled()
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          engine/**
          lib/**
    
    - name: Skip if no Engine/lib changes
      if: steps.changed-files.outputs.any_changed == 'false' && github.event_name == 'pull_request'
      run: echo "No Engine/lib files changed, skipping..."
    
    - name: Download pre-built wheels
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: actions/download-artifact@v4
      with:
        pattern: '*-wheel'
        path: /tmp/wheels/
        merge-multiple: true
      continue-on-error: true
    
    - name: Install uv
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python 3.12
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: uv python install 3.12
      
    - name: Install dependencies
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        # CI mode: use pre-built wheels via --find-links, skip editable sources
        uv sync --dev --python 3.12 --no-sources --find-links /tmp/wheels/
    
    - name: Run unit tests
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        uv run --no-sync pytest tests/ -v --tb=short -m "not integration and not distributed and not workflow and not chaos and not stability"
    
    - name: Upload Ray logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ray-logs-unit-${{ github.run_id }}
        path: /tmp/ray/
        retention-days: 1
        if-no-files-found: ignore

  # ============================================================================
  # Engine integration tests (requires Aether, Spark JARs)
  # ============================================================================

  test-engine-integration:
    name: Engine Integration Tests
    runs-on: ubuntu-latest
    needs: [build-raydp, build-workqueue-rs]
    if: always() && !cancelled()
    
    steps:
    - name: Free up disk space
      run: |
        echo "Disk space before cleanup:"
        df -h /
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        echo "Disk space after cleanup:"
        df -h /

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download pre-built wheels
      uses: actions/download-artifact@v4
      with:
        pattern: '*-wheel'
        path: /tmp/wheels/
        merge-multiple: true
      continue-on-error: true
    
    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Start control plane services
      run: |
        cd control
        docker compose build
        docker compose up -d 
        
        echo "Waiting for aether to be ready..."
        for i in {1..30}; do
          if curl -f http://localhost:8000/api/health 2>/dev/null; then
            echo "Control plane is ready!"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 2
        done
        
        docker compose ps
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python 3.12
      run: uv python install 3.12
      
    - name: Install dependencies
      run: |
        cd engine
        # CI mode: use pre-built wheels via --find-links, skip editable sources
        uv sync --dev --python 3.12 --no-sources --find-links /tmp/wheels/
    
    - name: Run integration tests
      run: |
        cd engine
        uv run --no-sync pytest tests/ -v --tb=short -m "integration"
    
    - name: Upload Ray logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ray-logs-integration-${{ github.run_id }}
        path: /tmp/ray/
        retention-days: 1
        if-no-files-found: ignore
    
    - name: Stop services
      if: always()
      run: |
        cd control
        docker compose down -v

  # ============================================================================
  # Engine distributed tests (multi-worker Ray pipelines)
  # ============================================================================

  test-engine-distributed:
    name: Engine Distributed Tests
    runs-on: ubuntu-latest
    needs: [build-raydp, build-workqueue-rs]
    if: always() && !cancelled()
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          engine/**
          lib/**
    
    - name: Skip if no Engine/lib changes
      if: steps.changed-files.outputs.any_changed == 'false' && github.event_name == 'pull_request'
      run: echo "No Engine/lib files changed, skipping..."
    
    - name: Download pre-built wheels
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: actions/download-artifact@v4
      with:
        pattern: '*-wheel'
        path: /tmp/wheels/
        merge-multiple: true
      continue-on-error: true
    
    - name: Install uv
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python 3.12
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: uv python install 3.12
      
    - name: Install dependencies
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        # CI mode: use pre-built wheels via --find-links, skip editable sources
        uv sync --dev --python 3.12 --no-sources --find-links /tmp/wheels/
    
    - name: Run distributed tests
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        uv run --no-sync pytest tests/ -v --tb=short -m "distributed"
    
    - name: Upload Ray logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ray-logs-distributed-${{ github.run_id }}
        path: /tmp/ray/
        retention-days: 1
        if-no-files-found: ignore

  # ============================================================================
  # Engine stability tests (deterministic fault injection)
  # ============================================================================

  test-engine-stability:
    name: Engine Stability Tests
    runs-on: ubuntu-latest
    needs: [build-raydp, build-workqueue-rs]
    if: always() && !cancelled()
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          engine/**
          lib/**
    
    - name: Skip if no Engine/lib changes
      if: steps.changed-files.outputs.any_changed == 'false' && github.event_name == 'pull_request'
      run: echo "No Engine/lib files changed, skipping..."
    
    - name: Download pre-built wheels
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: actions/download-artifact@v4
      with:
        pattern: '*-wheel'
        path: /tmp/wheels/
        merge-multiple: true
      continue-on-error: true
    
    - name: Install uv
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python 3.12
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: uv python install 3.12
      
    - name: Install dependencies
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        # CI mode: use pre-built wheels via --find-links, skip editable sources
        uv sync --dev --python 3.12 --no-sources --find-links /tmp/wheels/
    
    - name: Run stability tests
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        uv run --no-sync pytest tests/ -v --tb=short -m "stability" --timeout=1200
    
    - name: Upload Ray logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ray-logs-stability-${{ github.run_id }}
        path: /tmp/ray/
        retention-days: 1
        if-no-files-found: ignore

  # ============================================================================
  # Engine workflow tests (end-to-end pipeline tests, slow)
  # ============================================================================

  test-engine-workflow:
    name: Engine Workflow Tests
    runs-on: ubuntu-latest
    needs: [build-raydp, build-workqueue-rs]
    if: always() && !cancelled()
    # Workflow tests are slow - doesn't block PR merge
    continue-on-error: true
    
    steps:
    - name: Free up disk space
      run: |
        echo "Disk space before cleanup:"
        df -h /
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        echo "Disk space after cleanup:"
        df -h /

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          engine/**
          lib/**
    
    - name: Skip if no Engine/lib changes
      if: steps.changed-files.outputs.any_changed == 'false' && github.event_name == 'pull_request'
      run: echo "No Engine/lib files changed, skipping..."
    
    - name: Install system dependencies
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Download pre-built wheels
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: actions/download-artifact@v4
      with:
        pattern: '*-wheel'
        path: /tmp/wheels/
        merge-multiple: true
      continue-on-error: true
    
    - name: Install uv
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python 3.12
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: uv python install 3.12
      
    - name: Install dependencies
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        # CI mode: use pre-built wheels via --find-links, skip editable sources
        uv sync --dev --python 3.12 --no-sources --find-links /tmp/wheels/
    
    - name: Run workflow tests
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        uv run --no-sync pytest tests/ -v --tb=short -m "workflow" --timeout=1200
    
    - name: Upload Ray logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ray-logs-workflow-${{ github.run_id }}
        path: /tmp/ray/
        retention-days: 1
        if-no-files-found: ignore
    
    - name: Cleanup test artifacts
      if: always()
      run: |
        rm -rf /tmp/video_workflow_test_*
        rm -rf /tmp/minhash_*
        rm -rf /tmp/nurion_cache

  # ============================================================================
  # Engine chaos tests (experimental, unstable)
  # ============================================================================

  test-engine-chaos:
    name: Engine Chaos Tests
    runs-on: ubuntu-latest
    needs: [build-raydp, build-workqueue-rs]
    if: always() && !cancelled()
    # Chaos tests are experimental and may be flaky - doesn't block PR merge
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        files: |
          engine/**
          lib/**
    
    - name: Skip if no Engine/lib changes
      if: steps.changed-files.outputs.any_changed == 'false' && github.event_name == 'pull_request'
      run: echo "No Engine/lib files changed, skipping..."
    
    - name: Download pre-built wheels
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: actions/download-artifact@v4
      with:
        pattern: '*-wheel'
        path: /tmp/wheels/
        merge-multiple: true
      continue-on-error: true
    
    - name: Install uv
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python 3.12
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: uv python install 3.12
      
    - name: Install dependencies
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        # CI mode: use pre-built wheels via --find-links, skip editable sources
        uv sync --dev --python 3.12 --no-sources --find-links /tmp/wheels/

    - name: Run chaos tests
      if: steps.changed-files.outputs.any_changed == 'true' || github.event_name == 'push'
      run: |
        cd engine
        uv run --no-sync pytest tests/ -v --tb=short -m "chaos" --timeout=600
    
    - name: Upload Ray logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ray-logs-chaos-${{ github.run_id }}
        path: /tmp/ray/
        retention-days: 1
        if-no-files-found: ignore
