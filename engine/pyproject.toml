[project]
name = "engine"
version = "0.2.0"
description = "Nurion engine: a Ray-based distributed streaming processing framework"
authors = [
    {name = "Nurion Contributors"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    # Core: Ray + Arrow + gRPC + Anvil
    "nurion-anvil",              # Anvil gRPC broker (built from lib/anvil-rs/)
    "ray[default]==2.54.0",
    "pyarrow>=23.0.0",
    "pandas>=2.0.0",
    "click>=8.1.7",
    "fsspec[s3]>=2024.0.0",
    "grpcio>=1.80.0",
    "tenacity>=9.1.0",
]

[project.optional-dependencies]
# Storage backends
lance = ["pylance>=4.0.0"]
iceberg = ["pyiceberg[sql-sqlite]>=0.11.1", "sqlalchemy>=2.0.48"]

# Compute
duckdb = ["duckdb>=1.5.0"]

# Dedup (MinHash)
dedup = ["xxhash>=3.6.0"]

# WebUI (dashboard + profiling)
webui = [
    "slatedb>=0.11.0",
    "fastapi>=0.135.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.42.0",
    "sse-starlette>=3.3.0",
    "py-spy>=0.4.1",
]

# Model inference serving
serve = ["prometheus-client>=0.24.0"]

# Spark integration
spark = ["nurion-raydp", "pyspark==3.5.6"]

# Everything
all = ["engine[lance,iceberg,duckdb,dedup,webui,serve,spark]"]

[project.scripts]
nurion = "_internal.main:main"

[dependency-groups]
dev = [
    "engine[all]",
    # Testing
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.3.1",
    "pytest-cov>=7.1.0",
    "diff-cover>=9.0.0",
    "testcontainers[minio,postgres]>=4.14.0",
    "minio>=7.2.0",
    "httpx>=0.28.0",
    "requests>=2.32.0",
    # Linting & type checking
    "ruff>=0.15.0",
    "mypy>=1.20.0",
    # Control-plane test deps (integration tests)
    "psycopg[binary]>=3.3.0",
    "pydantic-settings>=2.13.0",
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "lance-namespace>=0.6.0",
    "boto3>=1.42.0",
    "s3fs>=2026.3.0",
    "kubernetes>=35.0.0",
]

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm>=6.2", "maturin>=1.9"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# Local development: editable sources for anvil-py and raydp
# CI uses `uv sync --no-sources` to skip these and install pre-built wheels instead
[tool.uv.sources]
nurion-anvil = { path = "../lib/anvil-rs", editable = true }
nurion-raydp = { path = "../lib/raydp", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["_internal*", "nurion*", "workflows*"]

[tool.setuptools.package-data]
_internal = ["py.typed", "webui/templates/**/*", "webui/static/**/*"]
nurion = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.mypy]
python_version = "3.12"
warn_return_any = false  # Too many Ray/Arrow APIs return Any
warn_unused_configs = true
disallow_untyped_defs = false  # Gradually enable - many CLI/FastAPI routes need typing
check_untyped_defs = false  # Gradually enable - many union-attr errors
disallow_incomplete_defs = false  # Gradually enable
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Avoid noise during gradual typing
show_error_codes = true
exclude = [
    "^tests/",  # Tests don't need strict typing
    ".*anvil_pb2\\.py$",  # Generated protobuf files
    ".*anvil_pb2_grpc\\.py$",  # Generated gRPC files
]

[[tool.mypy.overrides]]
module = [
    "ray.*",
    "pyarrow.*",
    "pandas.*",
    "pyspark.*",
    "slatedb.*",
    "anvil_py.*",
    "requests.*",
    "httpx.*",
    "fsspec.*",
    "lance.*",
    "pyiceberg.*",
    "grpc.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "raydp",
    "raydp.*",
    "vllm",
    "vllm.*",
    "sglang",
    "sglang.*",
    "PIL",
    "PIL.*",
    "prometheus_client",
    "prometheus_client.*",
    "xxhash",
    "duckdb",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "raydp.*"
ignore_errors = true

# Gradually enable strict checking for core modules
# [[tool.mypy.overrides]]
# module = "runtime.core.models"
# disallow_untyped_defs = true
# check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/anvil_pb2.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-m 'not benchmark'"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince212",
    "ignore:lance is not fork-safe:UserWarning",
]
markers = [
    "integration: marks integration tests",
    "distributed: marks distributed tests (multi-worker Ray pipelines)",
    "stability: marks stability tests with deterministic fault injection",
    "chaos: marks chaos engineering tests with random failures (may be flaky)",
    "benchmark: marks performance benchmark tests (skipped by default in CI)",
    "slow: marks slow tests (Anvil broker startup ~5s per test)",
    "timeout: marks tests with timeout (requires pytest-timeout)",
]

[tool.coverage.run]
source = ["_internal"]
parallel = true
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.paths]
source = [
    "_internal/",
    "**/site-packages/_internal/",
]
